services:
  poweroff:
    build: .
    container_name: poweroff_app
    image: ghcr.io/rhusiev/poweroff:${VERSION:-latest}
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
    name: caddy # Ensure this matches your existing Caddy network name
